name: Update NPB Schedule

on:
  workflow_dispatch:

jobs:
  test-npb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test NPB access
        run: python scripts/update_schedule.py
