name: Update NPB Schedule

on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-npb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test NPB access
        run: python scripts/update_schedule.py
      - name: Commit updated schedule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games_2026.json
          git diff --cached --quiet || git commit -m "Update NPB schedule"
          git push
